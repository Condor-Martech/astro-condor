        - generic [ref=e30]: Instituto Joanir Zonta
    - img "Instituto Joanir Zonta" [ref=e32]
    - heading "Instituto Joanir Zonta" [level=1] [ref=e35]
    - article [ref=e36]:
      - generic [ref=e37]:
        - paragraph [ref=e38]:
          - text: O Instituto Joanir Zonta, que surgiu em 2008, tem seus projetos direcionados para as áreas educacionais, sociais e ambientais, alinhados aos Objetivos de Desenvolvimento Sustentável (ODS) da Agenda 2030 da Organização das Nações Unidas e aos objetivos estratégicos do Grupo Zonta. Da criação até hoje, já são
          - strong [ref=e39]: 1.150 instituições
          - text: e
          - strong [ref=e40]: 85 mil pessoas atendidas
          - text: .
        - heading "Pilar Educacional" [level=2] [ref=e41]
        - paragraph [ref=e42]: Pensando no ser humano como um ser biopsicossocial, a forma de educar e adquirir conhecimento vem de várias direções. Assim, este pilar visa desenvolver ações para a população, como divulgação de conhecimento cultural referente às suas respectivas regiões e ações educacionais para o lazer, proporcionando saúde e bem-estar, incentivo à prática desportiva de alto rendimento e a promoção de educação formal para crianças, jovens e adultos, dando o suporte necessário para que se tornem cidadãos ativos e transformadores da sociedade.
        - heading "Pilar Social" [level=2] [ref=e43]
        - paragraph [ref=e44]: Este pilar viabiliza e realiza ações que proporcionem acessibilidade, interação, transformação e desenvolvimento da sociedade, de acordo com as necessidades regionais.
        - heading "Pilar Ambiental" [level=2] [ref=e45]
        - paragraph [ref=e46]: Ações voltadas ao desenvolvimento sustentável do planeta, visando à geração de conhecimento e ao estímulo de atitudes da população para o cuidado com o meio ambiente, sem comprometer o futuro das próximas gerações.
        - paragraph [ref=e47]:
          - text: Além de realizar e apoiar diversos projetos que beneficiem a sociedade, o Instituto Joanir Zonta também realiza o
          - strong [ref=e48]: Programa Voluntariado Empresarial
          - text: ", com o intuito de incentivar os nossos colaboradores a participarem de forma mais ativa na construção de uma sociedade mais justa."
        - heading "Missão" [level=2] [ref=e49]
        - paragraph [ref=e50]: Intervir na sociedade, proporcionando a mudança de atitude da população, visando ao seu bem-estar por meio da educação, programas culturais, sociais, ambientais e de esporte e lazer e formando cidadãos mais dignos e comprometidos com o desenvolvimento social.
        - heading "Visão" [level=2] [ref=e51]
        - paragraph [ref=e52]: Ser reconhecido como um instituto de referência pelas ações que proporciona para o desenvolvimento da comunidade, nas áreas educacional, social e ambiental.
        - heading "Objetivo" [level=2] [ref=e53]
        - paragraph [ref=e54]: Fomentar ações de desenvolvimento social e atuar diretamente nas comunidades onde o Grupo Zonta está presente.
        - blockquote [ref=e55]:
          - paragraph [ref=e56]: “Proporcionar o desenvolvimento social e contribuir para escrever uma nova história de muitas famílias é exercer a cidadania de forma mais ativa, assumindo um papel transformador perante a sociedade. A responsabilidade social é um dos meios para a construção de um mundo melhor para todos.”
          - paragraph [ref=e57]:
            - text: —
            - strong [ref=e58]: Sandra Zonta
            - text: Presidente do Instituto Joanir Zonta
        - paragraph [ref=e59]:
          - text: Entre em contato conosco pelo e-mail
          - strong [ref=e60]: institutojoanirzonta.condor@gmail.com
          - text: e conheça nossos projetos.
